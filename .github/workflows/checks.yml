name: Publication checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/check-publication.py --ref HEAD
      - run: node manager/tests/test-search-engine.js
      - run: node comfyui/comfyui-prompt-extractor/tests/prompt_extractor.test.cjs
